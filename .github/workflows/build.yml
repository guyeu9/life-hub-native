name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
      # secrets context 不能在 step 的 if 中使用，先在 job env 中评估并存为布尔标记
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 仅当仓库配置了签名密钥 Secrets 时执行：解码 base64 密钥库并设置签名环境变量
      # 注意：secrets context 不能在 step 的 if 中引用，已在 job env 中用 HAS_KEYSTORE 标记
      - name: Prepare signing keystore (if secrets present)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV

      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (no signing secrets available)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate built APK(s)
        id: locate
        run: |
          set -e
          mkdir -p artifacts
          found=""
          for f in $(find app/build/outputs/apk -name '*.apk' 2>/dev/null); do
            cp "$f" artifacts/
            found="$found $(basename $f)"
          done
          echo "Built APKs:$found"
          ls -la artifacts/
          echo "has_apk=$(test -n "$found" && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: ${{ steps.locate.outputs.has_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lifehub-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## APK 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            echo "✅ 已使用 Secrets 中的密钥库签名 release APK" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 未配置签名 Secrets（KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD），已构建 debug APK" >> $GITHUB_STEP_SUMMARY
            echo "配置方法见 README「签名配置」章节" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "产物在 Artifacts 区下载（lifehub-apk）" >> $GITHUB_STEP_SUMMARY
