name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 密钥库已提交在 app/lifehub.keystore，build.gradle 中已配置签名
      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate built APK(s)
        id: locate
        run: |
          set -e
          mkdir -p artifacts
          found=""
          for f in $(find app/build/outputs/apk -name '*.apk' 2>/dev/null); do
            cp "$f" artifacts/
            found="$found $(basename $f)"
          done
          echo "Built APKs:$found"
          ls -la artifacts/
          echo "has_apk=$(test -n "$found" && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: ${{ steps.locate.outputs.has_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lifehub-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## APK 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 已使用仓库内 lifehub.keystore 签名 release APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "产物在 Artifacts 区下载（lifehub-apk）" >> $GITHUB_STEP_SUMMARY
